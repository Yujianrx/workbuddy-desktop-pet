[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "workbuddy-desktop-pet"
version = "0.7.3"
description = "A local Windows desktop companion for WorkBuddy"
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.8,<7", "Pillow>=11,<13"]

# 程序代码许可见仓库根目录 LICENSE（MIT，只覆盖代码）。角色素材许可见 NOTICE.md。
[project.urls]
Homepage = "https://github.com/Yujianrx/workbuddy-desktop-pet"
Repository = "https://github.com/Yujianrx/workbuddy-desktop-pet"
Issues = "https://github.com/Yujianrx/workbuddy-desktop-pet/issues"
Changelog = "https://github.com/Yujianrx/workbuddy-desktop-pet/blob/main/docs/releases/v0.7.3.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
workbuddy-pet = "workbuddy_pet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workbuddy_pet = [
  "catalog.json",
  "update_install.ps1",
  "assets/*.png",
  "assets/ui/*.svg",
  "assets/default_pet/*.json",
  "assets/default_pet/actions/*.gif",
  "assets/blue_fish/*.json",
  "assets/blue_fish/actions/*.gif",
  "assets/dragon_maid/*.json",
  "assets/dragon_maid/*.md",
  "assets/dragon_maid/actions/*.gif",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
